<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XIAO IoT 대시보드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 로그인 / 회원가입 -->
  <main id="auth-view" class="auth" hidden>
    <div class="card auth-card">
      <h1>XIAO IoT</h1>
      <p class="muted">ESP32-S3 원격 제어 대시보드</p>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="login">로그인</button>
        <button type="button" class="tab" data-mode="signup">회원가입</button>
      </div>

      <form id="auth-form">
        <label>이메일
          <input id="email" type="email" autocomplete="email" required />
        </label>
        <label>비밀번호
          <input id="password" type="password" autocomplete="current-password" minlength="6" required />
        </label>
        <button id="auth-submit" type="submit" class="primary">로그인</button>
        <p id="auth-msg" class="msg" role="status"></p>
      </form>
    </div>
  </main>

  <!-- 대시보드 -->
  <div id="dash-view" hidden>
    <header class="topbar">
      <strong>XIAO IoT 대시보드</strong>
      <div class="topbar-right">
        <span id="user-email" class="muted"></span>
        <button id="logout" type="button" class="ghost">로그아웃</button>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>장치 상태</h2>
        <p><span id="online-dot" class="dot"></span><span id="online-text">확인 중…</span></p>
        <p class="muted small">마지막 수신: <span id="last-seen">-</span></p>
        <p class="muted small">API: <code id="api-base"></code></p>
      </section>

      <section class="card">
        <h2>온도 (내장 센서)</h2>
        <p class="big"><span id="temp">-</span><span class="unit">°C</span></p>
      </section>

      <section class="card">
        <h2>WiFi 신호 (RSSI)</h2>
        <p class="big"><span id="rssi">-</span><span class="unit">dBm</span></p>
      </section>

      <section class="card">
        <h2>LED 제어 (GPIO21)</h2>
        <div class="led-row">
          <span id="led-bulb" class="bulb" aria-hidden="true"></span>
          <button id="led-toggle" type="button" class="primary">-</button>
        </div>
        <p id="led-msg" class="muted small" role="status"></p>
      </section>

      <section class="card wide">
        <h2>온도 기록 (최근 60개)</h2>
        <div class="chart-box"><canvas id="chart"></canvas></div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
